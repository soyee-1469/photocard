<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>토마톡 포토카드</title>
    <link rel="stylesheet" href="styles.css?v=214" />
  </head>
  <body>
    <aside id="menu" class="board-side">
      <div class="board-tabs">
        <button type="button" data-board="service" class="on">서비스화면</button>
        <button type="button" data-board="admin">관리자화면</button>
      </div>
      <div class="board-panel" data-board-panel="service">
      <h2>구매</h2>
      <button class="scene" data-scene="home">홈</button>
      <button class="scene" data-scene="detail">상세</button>
      <button class="scene" data-scene="pay">1장 결제</button>
      <button class="scene" data-scene="pay5">5장 결제</button>
      <button class="scene" data-scene="result">결과</button>
      <button class="scene" data-scene="five">5장 연속</button>
      <h2>앨범</h2>
      <button class="scene" data-scene="album">마이 앨범</button>
      <button class="scene" data-scene="stored">보관 중</button>
      <h2>마이페이지</h2>
      <button class="scene" data-scene="mypage">마이페이지</button>
      <h2>배송</h2>
      <button class="scene" data-scene="ship">배송받기</button>
      <h2>배송 현황</h2>
      <button class="scene" data-scene="track">전체</button>
      <button class="scene" data-scene="shipping_requested">배송 요청 완료</button>
      <button class="scene" data-scene="preparing">출고 준비</button>
      <button class="scene" data-scene="shipped">배송 중</button>
      <button class="scene" data-scene="delivered">수령</button>
      </div>
      <div class="board-panel" data-board-panel="admin" hidden></div>
    </aside>
    <div id="stage"><div id="app"></div></div>
    <aside id="notes" class="board-side"></aside>
    <script src="app.js?v=262"></script>
  </body>
</html>
